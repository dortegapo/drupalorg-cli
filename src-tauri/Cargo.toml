[package]
name = "drupalorg-workbench"
version = "0.1.0"
description = "Drupal.org project workbench"
authors = ["Drupal.org CLI contributors"]
edition = "2021"

[lib]
name = "drupalorg_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
