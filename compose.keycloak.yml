services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./tests/fixtures/keycloak/drupalorg-cli-dev-realm.json:/opt/keycloak/data/import/drupalorg-cli-dev-realm.json:ro
