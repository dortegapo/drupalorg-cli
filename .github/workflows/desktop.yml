name: Desktop

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency: desktop-release

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Build CLI phar
        shell: bash
        run: |
          composer install --no-interaction --no-progress --no-dev
          composer run box-install
          composer run box-build
          mkdir -p src-tauri/resources
          cp drupalorg.phar src-tauri/resources/drupalorg.phar

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Tauri application
        run: npm ci

      - name: Package and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Drupal Workbench ${{ inputs.tag || github.ref_name }}
          releaseBody: Desktop builds for Windows, Linux and macOS.
          releaseDraft: false
          prerelease: false
